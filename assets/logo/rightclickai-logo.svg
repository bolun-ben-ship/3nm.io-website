<!-- RightClick:AI — Full logo lockup (icon + wordmark) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" fill="none" aria-label="RightClick:AI">

  <!-- ── CURSOR MARK ──────────────────────────────────────────────────────── -->
  <g id="mark">
    <!-- Cursor body (filled pointer arrow) -->
    <path d="M4 2L20 14.5L14.2 16.8L11.5 24L4 2Z"
          fill="#15803D"/>

    <!-- Right-click context indicator: 3-dot menu, anchored at lower-right of cursor -->
    <circle cx="20.5" cy="20" r="1.3" fill="#15803D" opacity="0.55"/>
    <circle cx="20.5" cy="24" r="1.3" fill="#15803D" opacity="0.55"/>
    <circle cx="20.5" cy="28" r="1.3" fill="#15803D" opacity="0.55"/>
  </g>

  <!-- ── WORDMARK ─────────────────────────────────────────────────────────── -->
  <!-- Using geometric text simulation via paths would be fragile; we embed as text
       with a system-safe stack. The font loads from fontshare in the LP, but for
       a standalone SVG used as an image asset, embed as a text element. -->
  <text
    x="32"
    y="26"
    font-family="'Satoshi', 'Cabinet Grotesk', -apple-system, 'Helvetica Neue', sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="-0.04em"
    fill="#0D120F">RightClick</text>

  <text
    x="152"
    y="26"
    font-family="'Satoshi', 'Cabinet Grotesk', -apple-system, 'Helvetica Neue', sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="-0.04em"
    fill="#15803D">:AI</text>

</svg>
